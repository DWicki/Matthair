name: Release

# Runs when a tag such as v1.0.0 is pushed: builds, signs and publishes the APK on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "Matthair-${GITHUB_REF_NAME}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs "Matthair-${GITHUB_REF_NAME}.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Matthair-${GITHUB_REF_NAME}.apk" \
            --title "Matthair ${GITHUB_REF_NAME#v}" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts).txt"
